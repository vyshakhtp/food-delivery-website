<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Foodie SignUp</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <style>
        body{
            background:linear-gradient(135deg,#FFE8CC,#FFF8F2);
            font-family:'Poppins',sans-serif;
        }
        .sign-up-card{
            border:none;
            border-radius:25px;
            padding:30px;
            box-shadow:0 15px 35px rgba(0,0,0,.15);
        }
        .logo{
            font-size:55px;
            color:#FF6B35;
            margin-bottom:15px;
        }
        .sign-up-card h2{
            color:#FF6B35;
            font-weight:700;
        }
        .sign-up-card p{
            color:#777;
        }
        .input-group-text{
            background:#FF6B35;
            color:white;
            border:none;
        }
        .form-control{
            border-left:none;
            height:40px;
        }

        .form-control:focus{
            box-shadow:none;
            border-color:#FF6B35;
        }
        .sign-up-btn{
            background:#FF6B35;
            color:white;
            font-weight:600;
            height:40px;
            border:none;
            border-radius:10px;
            transition:.3s;
        }
        .sign-up-btn:hover{
            background:#E85D04;
            transform:translateY(-3px);
        }
        a{
            text-decoration:none;
            color:#FF6B35;
            font-weight:500;
        }
        a:hover{
            text-decoration:underline;
        }
    </style>>

</head>

<body>

    <div class="container">
        <div class="row justify-content-center align-items-center min-vh-100">
            <div class="col-lg-6 col-md-8">
                <div class="card sign-up-card">
                    <div class="text-center mb-4">
                        <i class="fa-solid fa-pizza-slice logo"></i>
                        <h2>Foodie</h2>
                        <p>Create your account and start exploring delicious meals delivered to your doorstep.</p>
                    </div>
                    <form>
                        <div class="mb-3">
                            <label class="form-label">Username</label>
                            <div class="input-group">
                                <span class="input-group-text">
                                    <i class="fa-solid fa-user"></i>
                                </span>
                                <input type="text"
                                    class="form-control" id="username"
                                    placeholder="Enter Username">
                            </div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Email:</label>
                            <div class="input-group">
                                <span class="input-group-text">
                                    <i class="fa-solid fa-envelope"></i>
                                </span>
                                <input type="email"
                                    class="form-control" id="email"
                                    placeholder="Enter Email">
                            </div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Phone Number:</label>
                            <div class="input-group">
                                <span class="input-group-text">
                                    <i class="fa-solid fa-envelope"></i>
                                </span>
                                <input type="text"
                                    class="form-control" id="mobile"
                                    placeholder="Enter Phone Number">
                            </div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Password</label>
                            <div class="input-group">
                                <span class="input-group-text">
                                    <i class="fa-solid fa-lock"></i>
                                </span>
                                <input type="password"
                                    class="form-control" id="password"
                                    placeholder="Enter Password">
                            </div>
                        </div>
                         <div class="mb-3">
                            <label class="form-label">Confirm Password</label>
                            <div class="input-group">
                                <span class="input-group-text">
                                    <i class="fa-solid fa-lock"></i>
                                </span>
                                <input type="password"
                                    class="form-control" id="cpassword"
                                    placeholder="Confirm password">
                            </div>
                        </div>
                        <button class="btn sign-up-btn w-100" type="button" onclick="SignUp()">Sign Up</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
<script>
    function SignUp(){
                let username=document.getElementById("username").value.trim();
                let email=document.getElementById("email").value.trim();
                let mobile=document.getElementById("mobile").value;
                let password=document.getElementById("password").value;
                let cpassword=document.getElementById("cpassword").value;

                
               if(username===""){
                    alert("👤 Please enter your username.");
                    return false;
                }

                if(email===""){
                    alert("📧 Please enter your email address.");
                    return false;
                }

                let emailpattern=/^[^]+@[^]+\.[a-z]{2,3}$/;
                if(!email.match(emailpattern)){
                    alert("❌ Please enter a valid email address.");
                    return false;
                }

                if(mobile===""){
                    alert("📱 Please enter your mobile number.");
                    return false;
                }

                if(mobile.length!==10){
                    alert("📱 Mobile number must contain exactly 10 digits.");
                    return false;
                }

                let mob=true;
                for(let j=0;j<mobile.length;j++){
                    if(mobile[j]>='0' && mobile[j]<='9'){
                        mob=true;
                    }
                    else{
                        mob=false;
                        break;
                    }
                }

                if(!mob){
                    alert("❌ Mobile number should contain only digits.");
                    return false;
                }
                if(password===""){
                    alert("🔑 Please create a password.");
                    return false;
                }

                if(password.length < 8){
                    alert("🔒 Password must be at least 8 characters long.");
                    return false;
                }

                if(cpassword===""){
                    alert("🔑 Please confirm your password.");
                    return false;
                }

                if(password!==cpassword){
                    alert("🔒 Password and Confirm Password do not match.");
                    return false;
                }
   
        alert("🎉 Welcome to Foodie! Your account has been created successfully.");
        window.open("index.html")
    }
    
</script>

</body>

</html>
