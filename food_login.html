<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Foodie Login</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <style>
        body{
            background:linear-gradient(135deg,#FFE8CC,#FFF8F2);
            font-family:'Poppins',sans-serif;
        }
        .login-card{
            border:none;
            border-radius:25px;
            padding:40px;
            box-shadow:0 15px 35px rgba(0,0,0,.15);
        }
        .logo{
            font-size:55px;
            color:#FF6B35;
            margin-bottom:15px;
        }
        .login-card h2{
            color:#FF6B35;
            font-weight:700;
        }
        .login-card p{
            color:#777;
        }
        .input-group-text{
            background:#FF6B35;
            color:white;
            border:none;
        }
        .form-control{
            border-left:none;
            height:50px;
        }

        .form-control:focus{
            box-shadow:none;
            border-color:#FF6B35;
        }
        .login-btn{
            background:#FF6B35;
            color:white;
            font-weight:600;
            height:50px;
            border:none;
            border-radius:10px;
            transition:.3s;
        }
        .login-btn:hover{
            background:#E85D04;
            transform:translateY(-3px);
        }
        a{
            text-decoration:none;
            color:#FF6B35;
            font-weight:500;
        }
        a:hover{
            text-decoration:underline;
        }
    </style>>

</head>

<body>

    <div class="container">
        <div class="row justify-content-center align-items-center min-vh-100">
            <div class="col-lg-5 col-md-7">
                <div class="card login-card">
                    <div class="text-center mb-4">
                        <i class="fa-solid fa-pizza-slice logo"></i>
                        <h2>Foodie</h2>
                        <p>Welcome Back!</p>
                    </div>
                    <form>
                        <div class="mb-3">
                            <label class="form-label">Username</label>
                            <div class="input-group">
                                <span class="input-group-text">
                                    <i class="fa-solid fa-user"></i>
                                </span>
                                <input type="text"
                                    class="form-control" id="username"
                                    placeholder="Enter username">
                            </div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Password</label>
                            <div class="input-group">
                                <span class="input-group-text">
                                    <i class="fa-solid fa-lock"></i>
                                </span>
                                <input type="password"
                                    class="form-control" id="password"
                                    placeholder="Enter password">
                            </div>
                        </div>
                        <div class="d-flex justify-content-between mb-4">
                            <a href="#">Forgot Password?</a>
                            <a href="food-signup.html">Sign Up</a>
                        </div>
                        <button class="btn login-btn w-100" type="button" onclick="login()">Login</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
<script>
    function login(){
        let username=document.getElementById("username").value.trim();
        let password=document.getElementById("password").value;

        if(username===""){
                    alert("👤 Please enter your username.");
                    return false;
                }
        if(password===""){
                    alert("🔑 Please enter your password.");
                    return false;
                }
        alert("👋 Welcome back! Enjoy your favorite meals.");
        window.open("index.html")
    }
</script>

</body>

</html>
